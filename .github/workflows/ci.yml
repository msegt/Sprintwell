name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sprintwell
          POSTGRES_PASSWORD: sprintwell
          POSTGRES_DB: sprintwell_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sprintwell" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pg
        env:
          SPRINTWELL_TEST_PG: postgres://sprintwell:sprintwell@localhost:5432/sprintwell_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
